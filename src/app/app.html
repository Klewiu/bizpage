<div class="flex min-h-screen flex-col text-carbon">
  <header class="site-header sticky top-0 z-40">
    <div
      class="relative mx-auto flex w-full max-w-6xl items-center justify-between px-6 py-5 md:px-10"
    >
      <a
        class="brand-link"
        routerLink="/home"
        (click)="closeMobileMenu()"
        aria-label="WickyWave Software"
      >
        <svg class="brand-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="36" height="36" rx="8" fill="#4F46E5"/>
          <polyline points="6,8 12,26 18,15 24,26 30,8" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">WickyWave <span class="brand-sub">Software</span></span>
      </a>

      <nav
        class="absolute left-1/2 hidden -translate-x-1/2 items-center gap-2 xl:flex"
        aria-label="Main menu"
      >
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.path"
          routerLinkActive="menu-link-active"
          class="menu-link"
        >
          {{ t(item.label) }}
        </a>
      </nav>

      <div class="hidden items-center gap-2 xl:flex">
        <button
          class="locale-btn"
          [class.locale-btn-active]="locale() === 'pl'"
          (click)="setLocale('pl')"
          type="button"
        >
          PL
        </button>
        <button
          class="locale-btn"
          [class.locale-btn-active]="locale() === 'en'"
          (click)="setLocale('en')"
          type="button"
        >
          EN
        </button>
      </div>

      <button
        class="hamburger xl:hidden"
        type="button"
        (click)="toggleMobileMenu()"
        aria-label="Open mobile menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <div class="mobile-shell" [class.mobile-shell-open]="isMobileMenuOpen()">
    <div class="mobile-backdrop" (click)="closeMobileMenu()"></div>
    <nav class="mobile-panel" aria-label="Mobile menu">
      <div class="flex items-center justify-between">
        <div class="brand-link">
          <svg class="brand-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="36" height="36" rx="8" fill="#4F46E5"/>
            <polyline points="6,8 12,26 18,15 24,26 30,8" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="brand-name">WickyWave <span class="brand-sub">Software</span></span>
        </div>
        <button
          type="button"
          class="text-slate-300"
          (click)="closeMobileMenu()"
          aria-label="Close mobile menu"
        >
          ✕
        </button>
      </div>

      <div class="mt-10 grid gap-3">
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.path"
          (click)="closeMobileMenu()"
          class="mobile-link"
        >
          {{ t(item.label) }}
        </a>
      </div>

      <div class="mt-8 flex gap-2">
        <button
          class="locale-btn w-1/2"
          [class.locale-btn-active]="locale() === 'pl'"
          (click)="setLocale('pl')"
          type="button"
        >
          PL
        </button>
        <button
          class="locale-btn w-1/2"
          [class.locale-btn-active]="locale() === 'en'"
          (click)="setLocale('en')"
          type="button"
        >
          EN
        </button>
      </div>
    </nav>
  </div>

  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <footer
    class="site-footer px-6 py-12 text-sm text-slate-400 md:px-10 md:py-14"
  >
    <div class="footer-wave-wrapper" aria-hidden="true">
      <div class="footer-wave one"></div>
      <div class="footer-wave two"></div>
      <div class="footer-wave three"></div>
      <div class="footer-wave four"></div>
      <div class="footer-wave five"></div>
    </div>

    <div class="relative mx-auto max-w-6xl">
      {{ t("footer.copy") }}
    </div>
  </footer>
</div>
