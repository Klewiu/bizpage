<!-- ============================================================
     APP SHELL – główny wrapper, zarządza trybem dnia/nocy
     Klasa .night-theme jest dodawana dynamicznie przez isDarkMode()
     ============================================================ -->
<div
  class="app-shell flex min-h-screen flex-col text-carbon"
  [style.--page-background]="pageBackground()"
  [style.--page-heading]="themeColor([15, 23, 42], [248, 250, 252])"
  [style.--page-copy]="themeColor([71, 85, 105], [203, 213, 225])"
  [style.--card-background]="themeColor([255, 255, 255], [30, 41, 59])"
  [style.--card-heading]="themeColor([15, 23, 42], [248, 250, 252])"
  [style.--card-copy]="themeColor([71, 85, 105], [203, 213, 225])"
  [class.night-theme]="isDarkMode()"
>
  <!-- ── HEADER / NAWIGACJA GŁÓWNA ────────────────────────────── -->
  <header class="site-header sticky top-0 z-40">
    <div
      class="relative mx-auto flex w-full max-w-6xl items-center justify-between px-6 py-5 md:px-10"
    >
      <a
        class="brand-link"
        routerLink="/home"
        (click)="closeMobileMenu()"
        aria-label="WickyWave Software"
      >
        <svg
          class="brand-icon"
          viewBox="0 0 36 36"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <rect width="36" height="36" rx="8" fill="#4F46E5" />
          <polyline
            points="6,8 12,26 18,15 24,26 30,8"
            fill="none"
            stroke="white"
            stroke-width="2.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="brand-name"
          >WickyWave <span class="brand-sub">Software</span></span
        >
      </a>

      <nav
        class="absolute left-1/2 hidden -translate-x-1/2 items-center gap-2 xl:flex"
        aria-label="Main menu"
      >
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.scrollTarget ? null : item.path"
          [routerLinkActive]="item.skipActive ? '' : 'menu-link-active'"
          (click)="scrollToSection(item.scrollTarget)"
          class="menu-link"
          [class.cursor-pointer]="!!item.scrollTarget"
        >
          {{ t(item.label) }}
        </a>
      </nav>

      <div class="hidden items-center gap-2 xl:flex">
        <button
          class="theme-btn"
          (click)="toggleDarkMode()"
          type="button"
          [attr.aria-label]="isDarkMode() ? 'Tryb dzienny' : 'Tryb nocny'"
        >
          @if (isDarkMode()) {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          }
        </button>
        <button
          class="locale-btn"
          [class.locale-btn-active]="locale() === 'pl'"
          (click)="setLocale('pl')"
          type="button"
        >
          PL
        </button>
        <button
          class="locale-btn"
          [class.locale-btn-active]="locale() === 'en'"
          (click)="setLocale('en')"
          type="button"
        >
          EN
        </button>
      </div>

      <button
        class="hamburger xl:hidden"
        type="button"
        (click)="toggleMobileMenu()"
        aria-label="Open mobile menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- ── MOBILE MENU – panel wysuwany z góry (widoczny < xl) ──── -->
  <div class="mobile-shell" [class.mobile-shell-open]="isMobileMenuOpen()">
    <div class="mobile-backdrop" (click)="closeMobileMenu()"></div>
    <nav class="mobile-panel" aria-label="Mobile menu">
      <div class="flex items-center justify-between">
        <div class="brand-link">
          <svg
            class="brand-icon"
            viewBox="0 0 36 36"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <rect width="36" height="36" rx="8" fill="#4F46E5" />
            <polyline
              points="6,8 12,26 18,15 24,26 30,8"
              fill="none"
              stroke="white"
              stroke-width="2.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="brand-name"
            >WickyWave <span class="brand-sub">Software</span></span
          >
        </div>
        <button
          type="button"
          class="text-slate-300"
          (click)="closeMobileMenu()"
          aria-label="Close mobile menu"
        >
          ✕
        </button>
      </div>

      <div class="mt-10 grid gap-3">
        <a
          *ngFor="let item of navItems"
          [routerLink]="item.scrollTarget ? null : item.path"
          [fragment]="undefined"
          (click)="closeMobileMenu(); scrollToSection(item.scrollTarget)"
          class="mobile-link"
        >
          {{ t(item.label) }}
        </a>
      </div>

      <div class="mt-8 flex gap-2">
        <button
          class="locale-btn w-1/2"
          [class.locale-btn-active]="locale() === 'pl'"
          (click)="setLocale('pl')"
          type="button"
        >
          PL
        </button>
        <button
          class="locale-btn w-1/2"
          [class.locale-btn-active]="locale() === 'en'"
          (click)="setLocale('en')"
          type="button"
        >
          EN
        </button>
        <button
          class="theme-btn-mobile"
          (click)="toggleDarkMode()"
          type="button"
          [attr.aria-label]="isDarkMode() ? 'Tryb dzienny' : 'Tryb nocny'"
        >
          @if (isDarkMode()) {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          }
        </button>
      </div>
    </nav>
  </div>

  <!-- ── MAIN CONTENT – router-outlet wstrzykuje tutaj strony ─── -->
  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <!-- ── FOOTER – animacja oceanu zmienia się z trybem dnia/nocy  -->
  <footer
    class="site-footer px-6 pb-12 pt-20 text-sm text-slate-400 md:px-10 md:pb-14 md:pt-24"
  >
    <app-ocean-banner
      class="footer-ocean"
      [time]="footerTime()"
      [decorative]="true"
    ></app-ocean-banner>

    <div class="relative mx-auto max-w-6xl text-white">
      {{ t("footer.copy") }}
    </div>
  </footer>
</div>
