<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#7C3AED">
    <title>404 — Nie znaleziono strony | WickyWave</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
      :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
      main { max-width: 40rem; text-align: center; }
      .code { color: #7c3aed; font-weight: 800; }
      h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); margin: 0.75rem 0 1rem; }
      p { color: #475569; line-height: 1.6; }
      a { display: inline-block; margin-top: 1.5rem; border-radius: 0.625rem; background: #4f46e5; color: #fff; padding: 0.8rem 1.75rem; font-weight: 600; text-decoration: none; }
      a:hover { background: #4338ca; }
      @media (prefers-color-scheme: dark) {
        :root { background: #121828; color: #f8fafc; }
        p { color: #cbd5e1; }
        .code { color: #c4b5fd; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Nie znaleziono strony / Page not found</h1>
      <p>Ta strona nie istnieje lub została usunięta.<br><span lang="en">This page does not exist or has been removed.</span></p>
      <a href="/">Wróć na stronę główną / Back to home</a>
    </main>
  </body>
</html>
